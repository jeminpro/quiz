<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img">
  <title>Visual evidence for an Art and Design question</title>
  <desc>A sequence of shapes increases in size with each step. Which image should come next?</desc>
  <defs></defs>
  <rect width="1200" height="700" rx="28" fill="#f7f3ea"/>
  <text x="600" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#27231f">Study the four visual examples</text>
  <rect x="55" y="88" width="1090" height="205" rx="18" fill="#fffdf8" stroke="#413b34" stroke-width="3"/><g transform="translate(130 185) rotate(0)"><path d="M0 -22L22 22L-22 22z" fill="#397b8b"/></g><text x="225" y="195" font-size="42" fill="#4d4842">→</text><g transform="translate(320 185) rotate(45)"><path d="M0 -31L31 31L-31 31z" fill="#d7843d"/></g><text x="415" y="195" font-size="42" fill="#4d4842">→</text><g transform="translate(510 185) rotate(90)"><path d="M0 -40L40 40L-40 40z" fill="#397b8b"/></g><text x="605" y="195" font-size="42" fill="#4d4842">→</text><g transform="translate(700 185) rotate(135)"><path d="M0 -49L49 49L-49 49z" fill="#d7843d"/></g>
  <text x="600" y="336" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#27231f">Which option continues the rule?</text><g transform="translate(80 385)"><rect width="240" height="240" rx="18" fill="#fffdf8" stroke="#413b34" stroke-width="3"/><circle cx="28" cy="28" r="18" fill="#222"/><text x="28" y="35" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700" fill="white">A</text><g transform="translate(120 132) rotate(45)"><path d="M0 -44L44 44L-44 44z" fill="#d7843d"/></g></g><g transform="translate(360 385)"><rect width="240" height="240" rx="18" fill="#fffdf8" stroke="#413b34" stroke-width="3"/><circle cx="28" cy="28" r="18" fill="#222"/><text x="28" y="35" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700" fill="white">B</text><g transform="translate(120 132) rotate(90)"><path d="M0 -52L52 52L-52 52z" fill="#397b8b"/></g></g><g transform="translate(640 385)"><rect width="240" height="240" rx="18" fill="#fffdf8" stroke="#413b34" stroke-width="3"/><circle cx="28" cy="28" r="18" fill="#222"/><text x="28" y="35" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700" fill="white">C</text><g transform="translate(120 132) rotate(135)"><path d="M0 -60L60 60L-60 60z" fill="#d7843d"/></g></g><g transform="translate(920 385)"><rect width="240" height="240" rx="18" fill="#fffdf8" stroke="#413b34" stroke-width="3"/><circle cx="28" cy="28" r="18" fill="#222"/><text x="28" y="35" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700" fill="white">D</text><g transform="translate(120 132) rotate(0)"><path d="M0 -44L44 44L-44 44z" fill="#397b8b"/></g></g>
</svg>

    <circle cx="30" cy="30" r="19" fill="#222"/><text x="30" y="37" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="white">C</text>
    
      <path d="M82 56h92M82 56l30-18M82 56l28 22" stroke="#e3a21a" stroke-width="8" stroke-linecap="round"/>
      <ellipse cx="270" cy="212" rx="90" ry="18" fill="#17202a" opacity=".35"/>
      <circle cx="252" cy="132" r="86" fill="url(#light2)" stroke="#30343b" stroke-width="3"/>
  </g>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img">
  <title>Visual evidence for an Art and Design question</title>
  <desc>Two drawings of a face use different shading techniques. Which one creates the strongest impression of depth?</desc>
  <defs><radialGradient id="light0" cx="28%" cy="24%" r="68%"><stop offset="0" stop-color="#fff"/><stop offset=".2" stop-color="#ddd"/><stop offset="1" stop-color="#2d3038"/></radialGradient><radialGradient id="light1" cx="72%" cy="28%" r="68%"><stop offset="0" stop-color="#fff"/><stop offset=".2" stop-color="#ddd"/><stop offset="1" stop-color="#2d3038"/></radialGradient><radialGradient id="light2" cx="50%" cy="72%" r="68%"><stop offset="0" stop-color="#fff"/><stop offset=".2" stop-color="#ddd"/><stop offset="1" stop-color="#2d3038"/></radialGradient><radialGradient id="light3" cx="35%" cy="50%" r="68%"><stop offset="0" stop-color="#fff"/><stop offset=".2" stop-color="#ddd"/><stop offset="1" stop-color="#2d3038"/></radialGradient></defs>
  <rect width="1200" height="700" rx="28" fill="#f7f3ea"/>
  <text x="600" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#27231f">Study the four visual examples</text>
  <g transform="translate(42 78)">

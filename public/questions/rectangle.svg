  <rect x="90" y="65" width="240" height="125" fill="#d6eecf" stroke="#23674d" stroke-width="4"/>
  <text x="210" y="48" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#214836">6 cm</text>
  <text x="52" y="133" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#214836">4 cm</text>

<svg xmlns="http://www.w3.org/2000/svg" width="860" height="400" viewBox="0 0 860 400" role="img">
  <title>A wheel and axle</title>
  <desc>Two wheels are fixed to one axle. The axle rests in two holders.</desc>
  <rect width="860" height="400" rx="18" fill="#f4f7fb"/>
  <text x="430" y="36" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#1f2937">A wheel and axle</text>
  
    <circle cx="180" cy="190" r="70" fill="#cbd5e1" stroke="#1f2937" stroke-width="4"/>
    <circle cx="180" cy="190" r="14" fill="#1f2937"/>
    <circle cx="680" cy="190" r="70" fill="#cbd5e1" stroke="#1f2937" stroke-width="4"/>
    <circle cx="680" cy="190" r="14" fill="#1f2937"/>
    <rect x="180" y="176" width="500" height="28" fill="#d97706" stroke="#1f2937" stroke-width="3"/>
    <path d="M300 210 v50 h70 v-50" fill="none" stroke="#1d4e89" stroke-width="6"/>
    <path d="M490 210 v50 h70 v-50" fill="none" stroke="#1d4e89" stroke-width="6"/>
    <text x="180" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2937">Wheel</text>
    <text x="430" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2937">Axle</text>
    <text x="680" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2937">Wheel</text>
    <text x="430" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2937">Axle holder</text>
    <text x="430" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#475569">Each wheel is fixed to the axle.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="300" viewBox="0 0 1080 300" role="img">
  <title>A timeline of Britain</title>
  <desc>Time runs from left (earlier) to right (later).</desc>
  <rect width="1080" height="300" rx="18" fill="#f4f7fb"/>
  <text x="540" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#1f2937">A timeline of Britain</text>
  <text x="540" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#475569">Time runs from left (earlier) to right (later).</text>
  <line x1="78" y1="128" x2="1044" y2="128" stroke="#1d4e89" stroke-width="4"/>
  <polygon points="1044,128 1030,120 1030,136" fill="#1d4e89"/>
  
    <line x1="78" y1="114" x2="78" y2="142" stroke="#1d4e89" stroke-width="3"/>
    <circle cx="78" cy="128" r="7" fill="#1d4e89"/>
    <text x="78" y="164" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#1f2937">Stone Age</text>
    <line x1="210.85714285714286" y1="114" x2="210.85714285714286" y2="142" stroke="#1d4e89" stroke-width="3"/>
    <circle cx="210.85714285714286" cy="128" r="7" fill="#1d4e89"/>
    <text x="210.85714285714286" y="164" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#1f2937">Romans</text>
    <text x="210.85714285714286" y="182" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#1f2937">AD 43</text>
    <line x1="343.7142857142857" y1="114" x2="343.7142857142857" y2="142" stroke="#1d4e89" stroke-width="3"/>
    <circle cx="343.7142857142857" cy="128" r="7" fill="#1d4e89"/>
    <text x="343.7142857142857" y="164" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#1f2937">Anglo-</text>
    <text x="343.7142857142857" y="182" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#1f2937">Saxons</text>
    <line x1="476.57142857142856" y1="114" x2="476.57142857142856" y2="142" stroke="#1d4e89" stroke-width="3"/>
    <circle cx="476.57142857142856" cy="128" r="7" fill="#1d4e89"/>
    <text x="476.57142857142856" y="164" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#1f2937">Vikings</text>
    <line x1="609.4285714285714" y1="114" x2="609.4285714285714" y2="142" stroke="#1d4e89" stroke-width="3"/>
    <circle cx="609.4285714285714" cy="128" r="7" fill="#1d4e89"/>
    <text x="609.4285714285714" y="164" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#1f2937">1066</text>
    <line x1="742.2857142857143" y1="114" x2="742.2857142857143" y2="142" stroke="#1d4e89" stroke-width="3"/>
    <circle cx="742.2857142857143" cy="128" r="7" fill="#1d4e89"/>
    <text x="742.2857142857143" y="164" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#1f2937">Great Fire</text>
    <text x="742.2857142857143" y="182" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#1f2937">1666</text>
    <line x1="875.1428571428571" y1="114" x2="875.1428571428571" y2="142" stroke="#1d4e89" stroke-width="3"/>
    <circle cx="875.1428571428571" cy="128" r="7" fill="#1d4e89"/>
    <text x="875.1428571428571" y="164" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#1f2937">Victorians</text>
    <line x1="1008" y1="114" x2="1008" y2="142" stroke="#1d4e89" stroke-width="3"/>
    <circle cx="1008" cy="128" r="7" fill="#1d4e89"/>
    <text x="1008" y="164" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#1f2937">Moon landing</text>
    <text x="1008" y="182" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#1f2937">1969</text>
  <text x="24" y="268" font-family="Arial, sans-serif" font-size="14" fill="#64748b">earlier</text>
  <text x="1056" y="268" text-anchor="end" font-family="Arial, sans-serif" font-size="14" fill="#64748b">later</text>

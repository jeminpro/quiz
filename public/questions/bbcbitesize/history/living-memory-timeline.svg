<svg xmlns="http://www.w3.org/2000/svg" width="860" height="300" viewBox="0 0 860 300" role="img">
  <title>Some events older people remember</title>
  <desc>Time runs from left (earlier) to right (later).</desc>
  <rect width="860" height="300" rx="18" fill="#f4f7fb"/>
  <text x="430" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#1f2937">Some events older people remember</text>
  <text x="430" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#475569">Time runs from left (earlier) to right (later).</text>
  <line x1="78" y1="128" x2="824" y2="128" stroke="#1d4e89" stroke-width="4"/>
  <polygon points="824,128 810,120 810,136" fill="#1d4e89"/>
  
    <line x1="78" y1="114" x2="78" y2="142" stroke="#1d4e89" stroke-width="3"/>
    <circle cx="78" cy="128" r="7" fill="#1d4e89"/>
    <text x="78" y="164" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#1f2937">VE Day</text>
    <text x="78" y="182" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#1f2937">1945</text>
    <line x1="255.5" y1="114" x2="255.5" y2="142" stroke="#1d4e89" stroke-width="3"/>
    <circle cx="255.5" cy="128" r="7" fill="#1d4e89"/>
    <text x="255.5" y="164" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#1f2937">Windrush</text>
    <text x="255.5" y="182" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#1f2937">1948</text>
    <line x1="433" y1="114" x2="433" y2="142" stroke="#1d4e89" stroke-width="3"/>
    <circle cx="433" cy="128" r="7" fill="#1d4e89"/>
    <text x="433" y="164" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#1f2937">Grandad born</text>
    <text x="433" y="182" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#1f2937">1955</text>
    <line x1="610.5" y1="114" x2="610.5" y2="142" stroke="#1d4e89" stroke-width="3"/>
    <circle cx="610.5" cy="128" r="7" fill="#1d4e89"/>
    <text x="610.5" y="164" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#1f2937">Moon landing</text>
    <text x="610.5" y="182" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#1f2937">1969</text>
    <line x1="788" y1="114" x2="788" y2="142" stroke="#1d4e89" stroke-width="3"/>
    <circle cx="788" cy="128" r="7" fill="#1d4e89"/>
    <text x="788" y="164" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#1f2937">Child born</text>
    <text x="788" y="182" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#1f2937">2016</text>
  <text x="24" y="268" font-family="Arial, sans-serif" font-size="14" fill="#64748b">earlier</text>
  <text x="836" y="268" text-anchor="end" font-family="Arial, sans-serif" font-size="14" fill="#64748b">later</text>
</svg>

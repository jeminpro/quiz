    <text x="288" y="152" font-family="Arial, sans-serif" font-size="24" fill="#64748b">→</text>
    
  <rect x="310" y="100" width="100" height="88" rx="12" fill="#dbeafe" stroke="#1e3a8a" stroke-width="3"/>
  <text x="360" y="154" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#1e3a8a">A</text>
    <text x="418" y="152" font-family="Arial, sans-serif" font-size="24" fill="#64748b">→</text>
    
  <rect x="440" y="100" width="100" height="88" rx="12" fill="#bbf7d0" stroke="#1e3a8a" stroke-width="3"/>

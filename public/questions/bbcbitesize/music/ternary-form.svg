<svg xmlns="http://www.w3.org/2000/svg" width="760" height="280" viewBox="0 0 760 280" role="img">
  <title>A ternary plan</title>
  <rect width="760" height="280" rx="18" fill="#f4f7fb"/>
  <text x="380" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#1f2937">A ternary plan</text>
  
  <rect x="70" y="90" width="112" height="100" rx="14" fill="#dbeafe" stroke="#1e3a8a" stroke-width="3"/>
  <text x="126" y="148" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#1e3a8a">A</text>
  <text x="126" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#334155">first idea</text>
    <text x="214" y="150" font-family="Arial, sans-serif" font-size="28" fill="#64748b">→</text>
    
  <rect x="250" y="90" width="112" height="100" rx="14" fill="#fde68a" stroke="#1e3a8a" stroke-width="3"/>
  <text x="306" y="148" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#1e3a8a">B</text>
  <text x="306" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#334155">new idea</text>
    <text x="394" y="150" font-family="Arial, sans-serif" font-size="28" fill="#64748b">→</text>
    
  <rect x="430" y="90" width="112" height="100" rx="14" fill="#dbeafe" stroke="#1e3a8a" stroke-width="3"/>
  <text x="486" y="148" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#1e3a8a">A</text>
  <text x="486" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#334155">first idea</text>
</svg>

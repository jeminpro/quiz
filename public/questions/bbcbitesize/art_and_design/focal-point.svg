  <text x="430" y="36" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#1f2937">Shapes on a page</text>
  <circle cx="120" cy="120" r="14" fill="#94a3b8"/><circle cx="180" cy="200" r="14" fill="#94a3b8"/><circle cx="240" cy="110" r="14" fill="#94a3b8"/><circle cx="300" cy="240" r="14" fill="#94a3b8"/><circle cx="360" cy="140" r="14" fill="#94a3b8"/><circle cx="430" cy="220" r="14" fill="#94a3b8"/><circle cx="500" cy="120" r="14" fill="#94a3b8"/><circle cx="560" cy="200" r="14" fill="#94a3b8"/><circle cx="640" cy="130" r="14" fill="#94a3b8"/><circle cx="700" cy="230" r="14" fill="#94a3b8"/><circle cx="760" cy="150" r="14" fill="#94a3b8"/><circle cx="150" cy="280" r="14" fill="#94a3b8"/><circle cx="260" cy="300" r="14" fill="#94a3b8"/><circle cx="390" cy="300" r="14" fill="#94a3b8"/><circle cx="520" cy="280" r="14" fill="#94a3b8"/><circle cx="680" cy="300" r="14" fill="#94a3b8"/><circle cx="220" cy="160" r="14" fill="#94a3b8"/><circle cx="600" cy="170" r="14" fill="#94a3b8"/>

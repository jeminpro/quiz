<svg xmlns="http://www.w3.org/2000/svg" width="860" height="500" viewBox="0 0 860 500" role="img">
  <title>A colour wheel</title>
  <desc>Yellow is at the top, then orange, red, purple, blue and green. Red is opposite green, blue is opposite orange, and yellow is opposite purple.</desc>
  <rect width="860" height="500" rx="18" fill="#f4f7fb"/>
  <text x="430" y="36" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#1f2937">A colour wheel</text>
  <path d="M 430 250 L 364.0 135.7 A 132 132 0 0 1 496.0 135.7 Z" fill="#f6c945" stroke="#1f2937" stroke-width="2"/>
    <text x="430.0" y="60.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2937">Yellow</text>
<path d="M 430 250 L 496.0 135.7 A 132 132 0 0 1 562.0 250.0 Z" fill="#f08a24" stroke="#1f2937" stroke-width="2"/>
    <text x="594.5" y="155.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2937">Orange</text>
<path d="M 430 250 L 562.0 250.0 A 132 132 0 0 1 496.0 364.3 Z" fill="#d64545" stroke="#1f2937" stroke-width="2"/>
    <text x="594.5" y="345.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2937">Red</text>
<path d="M 430 250 L 496.0 364.3 A 132 132 0 0 1 364.0 364.3 Z" fill="#7d5cbf" stroke="#1f2937" stroke-width="2"/>
    <text x="430.0" y="440.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2937">Purple</text>
<path d="M 430 250 L 364.0 364.3 A 132 132 0 0 1 298.0 250.0 Z" fill="#3a74e0" stroke="#1f2937" stroke-width="2"/>
    <text x="265.5" y="345.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2937">Blue</text>
<path d="M 430 250 L 298.0 250.0 A 132 132 0 0 1 364.0 135.7 Z" fill="#2f9a57" stroke="#1f2937" stroke-width="2"/>
    <text x="265.5" y="155.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2937">Green</text>
    <circle cx="430" cy="250" r="34" fill="#f4f7fb" stroke="#1f2937" stroke-width="2"/>
    <text x="430" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#475569">Opposite colours sit across the wheel from each other.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="920" height="350" viewBox="0 0 920 350" role="img">
  <title>Four kinds of mark</title>
  <desc>Panel 1 has long smooth waves. Panel 2 has short jagged marks. Panel 3 has even parallel curves. Panel 4 has soft flicks.</desc>
  <rect width="920" height="350" rx="18" fill="#f4f7fb"/>
  <text x="460" y="36" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#1f2937">Four kinds of mark</text>
  
    <rect x="30" y="80" width="180" height="180" fill="#fff" stroke="#1f2937" stroke-width="3"/>
    <text x="120" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2937">1 Waves</text>
    
    <rect x="250" y="80" width="180" height="180" fill="#fff" stroke="#1f2937" stroke-width="3"/>
    <text x="340" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2937">2 Jagged</text>
    
    <rect x="470" y="80" width="180" height="180" fill="#fff" stroke="#1f2937" stroke-width="3"/>
    <text x="560" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2937">3 Curves</text>
    
    <rect x="690" y="80" width="180" height="180" fill="#fff" stroke="#1f2937" stroke-width="3"/>
    <text x="780" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2937">4 Flicks</text>

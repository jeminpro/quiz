<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img">
  <title>Torch and shadow</title>
  <desc>Object farther from the torch</desc>
  <rect width="900" height="420" rx="20" fill="#f4f7fb"/>
  
  <text x="450" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#1f2a37">Object farther from the light</text>
  <rect x="70" y="150" width="90" height="50" rx="10" fill="#fef08a" stroke="#334155" stroke-width="3"/>
  <circle cx="160" cy="175" r="18" fill="#fde047" stroke="#334155" stroke-width="3"/>
  <text x="115" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#475569">torch</text>
  <rect x="420" y="130" width="50" height="120" rx="8" fill="#64748b" stroke="#1f2937" stroke-width="3"/>
  <text x="445" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#475569">object</text>
  <rect x="600" y="100" width="18" height="200" fill="#94a3b8"/>
  <ellipse cx="620" cy="300" rx="45" ry="18" fill="#1e293b" opacity="0.55"/>
  <text x="620" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#475569">smaller shadow</text>
  <line x1="178" y1="175" x2="420" y2="140" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="178" y1="175" x2="420" y2="240" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6 4"/>

</svg>

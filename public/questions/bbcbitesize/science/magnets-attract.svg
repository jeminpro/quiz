<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img">
  <title>Bar magnets</title>
  <desc>Opposite poles face each other</desc>
  <rect width="900" height="420" rx="20" fill="#f4f7fb"/>
  
  <text x="450" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#1f2a37">Opposite poles face each other</text>
  <rect x="120" y="150" width="240" height="90" rx="12" fill="#e2e8f0" stroke="#334155" stroke-width="3"/>
  <rect x="120" y="150" width="120" height="90" rx="12" fill="#fecaca"/>
  <rect x="240" y="150" width="120" height="90" rx="12" fill="#bfdbfe"/>
  <text x="180" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#7f1d1d">N</text>
  <text x="300" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#1e3a8a">S</text>
  <rect x="540" y="150" width="240" height="90" rx="12" fill="#e2e8f0" stroke="#334155" stroke-width="3"/>
  <rect x="540" y="150" width="120" height="90" rx="12" fill="#fecaca"/>
  <rect x="660" y="150" width="120" height="90" rx="12" fill="#bfdbfe"/>
  <text x="600" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#7f1d1d">N</text>
  <text x="720" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#1e3a8a">S</text>
  <path d="M 380 195 L 520 195" stroke="#0f172a" stroke-width="4" marker-end="url(#arrow)"/>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#0f172a"/></marker></defs>
  <text x="450" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#334155">They pull together (attract)</text>

</svg>
